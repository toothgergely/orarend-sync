name: Órarend frissítése

on:
  schedule:
    # minden nap 6:00-kor UTC (nyáridőben 8:00, télidőben 7:00 magyar idő)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # kézi indítás a GitHub felületéről is lehetséges

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repo kiolvasása
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scraper futtatása
        env:
          INFORM_USER: ${{ secrets.INFORM_USER }}
          INFORM_PASS: ${{ secrets.INFORM_PASS }}
          TARGET_GROUP: "B"
        run: python scrape_and_generate_ics.py

      - name: Debug artifact feltöltése hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Frissített .ics commit-olása
        run: |
          git config user.name "inform-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/orarend.ics
          git diff --quiet && git diff --staged --quiet || git commit -m "Órarend frissítve ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
